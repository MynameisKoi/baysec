<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaySec @ SFBU — Internal Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-card {
            background: #111827;
            border: 1px solid #1f293d;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            width: 100%;
            max-width: 580px;
            padding: 28px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            color: #38bdf8;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .input-box:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #0369a1;
        }

        #status-msg {
            margin-top: 16px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .status-fail {
            color: #f87171;
        }

        .status-success {
            color: #4ade80;
        }
    </style>
</head>

<body>

    <!-- The flag is here: c2ZidXt3M2xjMG0zX3QwX2I0eXMzY18yMDI2fQ== -->

    <div class="terminal-card">
        <div class="badge">CHALLENGE 0x01</div>
        <h1>BaySec Security Gateway</h1>
        <p>Unauthorized access attempt logged. An operator left their session token lingering somewhere inside the
            client interface. Inspect the gateway to retrieve the token.</p>

        <input type="text" id="flagInput" class="input-box" placeholder="sfbu{...}" autocomplete="off" />
        <button class="btn" onclick="verifyFlag()">SUBMIT TOKEN</button>

        <div id="status-msg"></div>
    </div>

    <script>
        function verifyFlag() {
            const input = document.getElementById("flagInput").value.trim();
            const status = document.getElementById("status-msg");

            if (input === "sfbu{w3lc0m3_t0_b4ys3c_2026}") {
                status.className = "status-success";
                status.innerText = "ACCESS GRANTED. Welcome to BaySec @ SFBU!";
            } else {
                status.className = "status-fail";
                status.innerText = "ACCESS DENIED: Invalid flag format or token.";
            }
        }
    </script>
</body>

</html>
