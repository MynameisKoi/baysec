<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaySec @ SFBU — Internal Portal</title>
    <link rel="icon" type="image/png" href="../assets/baysec-blue.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-card {
            background: #111827;
            border: 1px solid #1f293d;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            width: 100%;
            max-width: 580px;
            padding: 28px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        .brand-logo {
            width: 120px;
            height: auto;
            cursor: pointer;
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.4));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
            user-select: none;
        }

        .brand-logo:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.7));
        }

        .brand-logo.denied {
            filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.8));
            animation: logoShake 0.4s ease-in-out;
        }

        @keyframes logoShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            color: #38bdf8;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .input-box:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #0369a1;
        }

        #status-msg {
            margin-top: 16px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .status-fail {
            color: #f87171;
        }

        .status-success {
            color: #4ade80;
        }
    </style>
</head>

<body>

    <!-- The flag is here: c2ZidXt3M2xjMG0zX3QwX2I0eXMzY18yMDI2fQ== -->

    <div class="terminal-card">
        <div class="logo-container">
            <img id="brandLogo" src="../assets/baysec-blue.png" alt="BaySec @ SFBU Logo" class="brand-logo" onclick="toggleLogoTheme()" title="Click to toggle crest" />
        </div>
        <div class="badge">CHALLENGE 0x01</div>
        <h1>BaySec Security Gateway</h1>
        <p>Unauthorized access attempt logged. An operator left their session token lingering somewhere inside the
            client interface. Inspect the gateway to retrieve the token.</p>

        <input type="text" id="flagInput" class="input-box" placeholder="sfbu{...}" autocomplete="off" />
        <button class="btn" onclick="verifyFlag()">SUBMIT TOKEN</button>

        <div id="status-msg"></div>
    </div>

    <script>
        function toggleLogoTheme() {
            const logo = document.getElementById("brandLogo");
            if (logo.src.includes("baysec-blue")) {
                logo.src = "../assets/baysec-red.png";
            } else {
                logo.src = "../assets/baysec-blue.png";
            }
        }

        function verifyFlag() {
            const input = document.getElementById("flagInput").value.trim();
            const status = document.getElementById("status-msg");
            const logo = document.getElementById("brandLogo");

            if (input === "sfbu{w3lc0m3_t0_b4ys3c_2026}") {
                status.className = "status-success";
                status.innerText = "ACCESS GRANTED. Welcome to BaySec @ SFBU!";
                logo.src = "../assets/baysec-blue.png";
                logo.classList.remove("denied");
            } else {
                status.className = "status-fail";
                status.innerText = "ACCESS DENIED: Invalid flag format or token.";
                logo.src = "../assets/baysec-red.png";
                logo.classList.remove("denied");
                void logo.offsetWidth;
                logo.classList.add("denied");
            }
        }
    </script>
</body>

</html>
